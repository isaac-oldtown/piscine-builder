id: d02-word-count
title: Word Count in Bash
language: bash
difficulty: 1
concept_difficulty: 1
hours: 1
prereqs: [d01-string-basics]
concepts: [reading standard input, exit codes]
introduces: [reading standard input, exit codes]
assumes: [splitting text into words]
target: program
scaffold: none
run: bash wc.sh
goal: Write a Bash script that counts the words it reads on standard input.
files:
  - { path: wc.sh, note: the script }
requirements: |
  `wc.sh` reads standard input and prints the number of **words**, followed by a newline.
  Words are separated by spaces, tabs and newlines.

  With `-l` as first argument it prints the number of **lines** instead: a line counts when
  it ends with a newline.
think_about:
  - blanks before the first word and after the last
  - input that does not end with a newline
  - no input at all
allowed: []
cases: |
  <<< "" => out == "0\n" exit 0
  # example
  <<< "hello world\n" => out == "2\n" exit 0
  <<< "  a\tb \n\n c  " => out == "3\n"
  # example
  -l <<< "a\nb\nc\n" => out == "3\n"
random:
  rounds: 25
  fuzz:
    - { name: words, stdin: 'string "ab \n\t" 0..60' }
    - { name: lines, argv: 'lit ["-l"]', stdin: 'string "ab \n" 0..60' }
