[tool.uv.workspace]
members = ["proctor", "coursecrafter"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "types-PyYAML>=6"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["examples", "proctor/tests/demo_solutions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Long prompt and harness strings are kept whole; the formatter handles code.
ignore = ["E501", "UP046", "UP047", "UP040"]

[tool.mypy]
python_version = "3.12"
files = ["proctor/src", "coursecrafter/src"]
mypy_path = ["proctor/src", "coursecrafter/src"]
explicit_package_bases = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["proctor/tests", "coursecrafter/tests"]
# Shared test helpers (`proctor/tests/common.py`).
pythonpath = ["proctor/tests"]
addopts = "-q --import-mode=importlib"
