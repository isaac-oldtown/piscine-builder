[package]
name = "taskmaster"
description = "levelup's course creator: turns a curriculum into specs, tests and references with an LLM"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
skillcheck = { path = "../skillcheck" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
yaml_serde = "0.10"
